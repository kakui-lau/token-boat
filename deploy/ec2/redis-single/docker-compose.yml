name: token-boat-redis

services:
  redis:
    image: redis:8.10.1-trixie@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
    container_name: token-boat-redis
    restart: unless-stopped
    init: true
    user: "${REDIS_UID}:${REDIS_GID}"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "8839:6379"
    volumes:
      - ./data:/data
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./secrets/users.acl:/run/secrets/users.acl:ro
      - ./secrets/health_password:/run/secrets/health_password:ro
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/health_password)" redis-cli --user health --no-auth-warning -h 127.0.0.1 -p 6379 ping | grep -qx PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 6g
    cpus: "1.75"
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
