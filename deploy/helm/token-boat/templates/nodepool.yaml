{{- if .Values.nodePool.create }}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ .Values.nodePool.name }}
  labels:
    {{- include "token-boat.labels" . | nindent 4 }}
spec:
  limits:
    {{- toYaml .Values.nodePool.limits | nindent 4 }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: {{ .Values.nodePool.consolidateAfter }}
    budgets:
      - nodes: 10%
  template:
    metadata:
      labels:
        workload: token-boat
    spec:
      expireAfter: {{ .Values.nodePool.expireAfter }}
      terminationGracePeriod: {{ .Values.nodePool.terminationGracePeriod }}
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: {{ .Values.nodePool.nodeClassName }}
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            {{- toYaml .Values.nodePool.capacityTypes | nindent 12 }}
        - key: eks.amazonaws.com/instance-category
          operator: In
          values:
            {{- toYaml .Values.nodePool.instanceCategories | nindent 12 }}
        - key: eks.amazonaws.com/instance-generation
          operator: Gt
          values:
            - {{ .Values.nodePool.minimumInstanceGeneration | quote }}
        - key: kubernetes.io/arch
          operator: In
          values:
            - {{ .Values.nodePool.architecture }}
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
      taints:
        - key: {{ .Values.nodePool.taint.key }}
          value: {{ .Values.nodePool.taint.value }}
          effect: {{ .Values.nodePool.taint.effect }}
{{- end }}
