# Frontend Development - Backend built from local source
#
# Prerequisite: PostgreSQL is available on the host at 127.0.0.1:5433/token-boat.
# Containers access the same database through host.docker.internal.
#
# Usage:
#   1. docker compose -f docker-compose.dev.yml up -d
#   2. make dev-web
#   3. Open http://localhost:5173 (Rsbuild dev server, API auto-proxied to :3000)
#
# Rebuild backend after Go code changes:
#   docker compose -f docker-compose.dev.yml up -d --build new-api
#
# Stop:
#   docker compose -f docker-compose.dev.yml down
#
# Reset data:
#   docker compose -f docker-compose.dev.yml down -v

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: new-api-dev:local
    container_name: new-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - dev_data:/data
    environment:
      - DATABASE_URL=postgresql://postgres:123456@host.docker.internal:5433/token-boat
      - SQL_DSN=postgresql://postgres:123456@host.docker.internal:5433/token-boat
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      # Keep local dashboard access/refresh tokens valid across container
      # rebuilds. Production must provide its own strong secret.
      - SESSION_SECRET=token-boat-local-dev-session-secret-change-before-production
      - BATCH_UPDATE_ENABLED=true
      # Local acceptance uses the contracted pricing schema; minimum-margin
      # fields remain canonical and are not removed by this switch.
      - PRICING_SCHEMA_FINALIZE=true
      # Local HTTP dev mode: keep Secure=false and leave TRUSTED_URL unset. This disables the refresh/logout OriginGuard so the :5173 -> :3000 dev proxy works.
      - SESSION_COOKIE_SECURE=false
      # For HTTPS only: set Secure=true and list every exact trusted HTTPS browser Origin. This does not configure relay CORS.
      # - SESSION_COOKIE_SECURE=true
      # - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com
    depends_on:
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: new-api-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - dev-network

volumes:
  dev_data:

networks:
  dev-network:
    driver: bridge
